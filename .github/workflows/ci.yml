name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # The Ruff baseline is an immutable source revision.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff==0.17.6
      - name: Ruff correctness rules
        run: ruff check --config pyproject.toml --target-version py39 --select E4,E7,E9,F src/
      - name: Ruff lint and format regressions
        run: python .github/check_ruff.py

  test:
    # setup-python publishes Python 3.9 for Ubuntu 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: pytest -v --tb=short -o faulthandler_timeout=60

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Validate package
        run: twine check dist/*
      - name: Check package contents
        run: |
          echo "=== Built packages ==="
          ls -la dist/
          echo "=== Wheel contents ==="
          python -m zipfile -l dist/*.whl | head -50
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
